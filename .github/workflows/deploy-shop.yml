name: Deploy shop software
# Puts the shop software online at 1gram.abharanamcollections.com/shop-admin (Cloudflare Worker + Container).
# Needs two repository secrets (Settings -> Secrets and variables -> Actions), see docs/GO-LIVE.md:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main]
    paths:
      - "apps/shop-admin/backend/app/**"
      - "apps/shop-admin/backend/requirements.txt"
      - "apps/shop-admin/frontend/**"
      - "apps/shop-admin/cloud/**"
      - "apps/shop-admin/Dockerfile"
      - ".github/workflows/deploy-shop.yml"
  workflow_dispatch:

concurrency:
  group: deploy-shop
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/shop-admin/cloud
    steps:
      - name: Skip until Cloudflare is connected
        if: env.CLOUDFLARE_API_TOKEN == ''
        working-directory: .
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set yet - nothing deployed (see docs/GO-LIVE.md step 6)."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci --no-audit --no-fund
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
